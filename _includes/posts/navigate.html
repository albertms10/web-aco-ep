<div class="post-nav">
    {%- if page.previous -%}
    <a class="post-previous"
       href="{{ page.previous.url }}"
       title="{{page.previous.title | escape }}">{{ page.previous.title | escape | truncatewords: 6 }}</a>
    {%- else -%}
    <span></span>
    {%- endif -%}

    {%- if page.next -%}
    <a class="post-next"
       href="{{ page.next.url }}"
       title="{{ page.next.title | escape }}">{{ page.next.title | escape | truncatewords: 6 }}</a>
    {%- else -%}
    <span></span>
    {%- endif -%}
</div>
