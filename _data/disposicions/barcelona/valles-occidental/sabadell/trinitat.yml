constructor:
  nom: Blancafort OM, SL
  any: 1998

# diapaso
diapaso:
  nota: a'
  temperatura: 15
  frequencia: 433.3

# temperament

estat:
  - any: 2025
    nota: 4

emplacament: a peu de nau, al cantó de l'Epístola

transmissio:
  notes: mecànica
  registres: mecànica

composicio: 10, II/P

teclats:
  - nom: I. Orgue major
    extensio: "56 notes: C-g'''"
    registres:
      - nom: Flautat
        peus: 8'
        partit: en façana
      - nom: Octava
        peus: 4'
      - nom: Plens III
        peus: 1 1/3'
      - nom: Orlos
        peus: 8'
        llengueta: true
        partit: en batalla

  - nom: II. Positiu
    extensio: "56 notes: C-g'''"
    registres:
      - nom: Bordó
        peus: 8'
      - nom: Tapadet
        peus: 4'
      - nom: Quinzena
        peus: 2'
      - nom: Corneta IV
        peus: 4'
        partit: g-d'''

pedal:
  extensio: "30 notes: C-f'"
  registres:
    - nom: Subbaix
      peus: 16'
    - nom: Baix
      peus: 8'
      partit: extensió del Subbaix
    - nom: Coral
      peus: 4'

acoblaments:
  - nom: II/I
  - nom: II/P
  - nom: I/P
